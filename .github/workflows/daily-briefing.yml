name: Daily Briefing (backup trigger)

# The backend runs an in-app APScheduler at 06:00 UTC, but that only fires if the
# Railway container happens to be alive at that exact moment. If the container
# restarts/redeploys/sleeps around 06:00 UTC, the run is silently missed (this is
# what happened on 2026-06-04). This workflow is an independent safety net: at
# 07:00 UTC it checks whether today's briefing already exists, and only triggers
# the pipeline if it's stale. That avoids a wasteful double-run on normal days
# while guaranteeing a fresh briefing on days the in-app scheduler missed.

on:
  schedule:
    - cron: '0 7 * * *'      # 07:00 UTC daily (after the 06:00 in-app run would finish)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  ensure-fresh-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://sitrep-production-6aac.up.railway.app
    steps:
      - name: Check whether today's briefing already exists
        id: check
        run: |
          set -uo pipefail
          today="$(date -u +%F)"
          payload="$(curl -sS --max-time 30 "$API/briefing/global" || echo '')"
          gen="$(printf '%s' "$payload" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('generated_at') or data.get('briefing', {}).get('generated_at') or '')" 2>/dev/null || echo '')"
          echo "today (UTC):         $today"
          echo "latest generated_at: ${gen:-<none>}"
          if [ -n "$gen" ] && [ "${gen:0:10}" = "$today" ]; then
            echo "Briefing is already fresh for $today -- nothing to do."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "Briefing is stale or undetermined -- will trigger the pipeline."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the pipeline if stale
        if: steps.check.outputs.stale == 'true'
        run: |
          set -uo pipefail
          echo "Triggering pipeline at $(date -u +%FT%TZ) ..."
          resp="$(curl -sS --max-time 1500 -X POST "$API/pipeline/run-weekly")"
          echo "Response (truncated):"; echo "$resp" | head -c 600; echo
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print('pipeline status:', d.get('status'), '| regions:', d.get('total_regions'), '| errors:', d.get('errors')); sys.exit(0 if d.get('status')=='success' else 1)"
